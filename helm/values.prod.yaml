# Production — public /logging for Flutter product telemetry
# ENVIRONMENT must be "prod" to match Grafana Product Env filter (not "production")
environment: prod
replicaCount: 1

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

vault:
  enabled: true
  secretPaths:
    otel:
      path: "apps/data/prod/infra/observability"
    mongodb:
      path: "apps/data/prod/infra/mongodb"
      template: |
        {{- with secret "apps/data/prod/infra/mongodb" -}}
        export MONGO_URL="mongodb://{{ .Data.data.username }}:{{ .Data.data.password }}@mongodb.infra.svc.cluster.local:27017/am_analytics?authSource=admin"
        {{- end }}
    redis:
      path: "apps/data/prod/infra/redis"
      template: |
        {{- with secret "apps/data/prod/infra/redis" -}}
        export REDIS_URL="redis://:{{ .Data.data.password }}@{{ .Data.data.host }}:{{ .Data.data.port }}/0"
        {{- end }}

env:
  ENVIRONMENT: prod
  LOG_LEVEL: INFO
  ALLOWED_ORIGINS: "https://am.asrax.in"

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-prod-global-cors@kubernetescrd,
      am-apps-prod-strip-prefix-apps@kubernetescrd
  hosts:
    - host: am.asrax.in
      paths:
        - path: /logging
          pathType: Prefix
