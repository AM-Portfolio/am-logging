# am-logging — base Helm values (universal-chart via am-pipelines)
# ENVIRONMENT must be one of: dev | preprod | prod (Grafana Product Env filter)
global:
  image:
    registry: ghcr.io/am-portfolio
    pullPolicy: Always
    imagePullSecrets:
      - name: regcred
  vault:
    enabled: true
    role: "am-backend-role"
    authPath: "auth/kubernetes"
    serviceAccountName: "am-backend-sa"

image:
  repository: am-logging

replicaCount: 1
language: python
port: 8000
service:
  port: 8000
entrypoint: "exec uvicorn main:app --host 0.0.0.0 --port 8000"

security:
  automountServiceAccountToken: true

config: {}

vault:
  enabled: true
  role: "am-backend-role"
  csi:
    enabled: true
  secretPaths:
    otel:
      path: "apps/data/preprod/infra/observability"
      mappings:
        TRACING_SAMPLING_PROBABILITY: "TRACING_SAMPLING_PROBABILITY"
    mongodb:
      path: "apps/data/preprod/infra/mongodb"
      mappings:
        MONGO_USERNAME: "username"
        MONGO_PASSWORD: "password"
    redis:
      path: "apps/data/preprod/infra/redis"
      mappings:
        REDIS_PASSWORD: "password"
        REDIS_HOST: "host"
        REDIS_PORT: "port"

env:
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4318/v1/traces"
  LOKI_URL: "http://monitoring-loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
  # Salt for hashing telemetry ids (override via Vault in prod)
  TELEMETRY_HASH_SALT: "am-product-telemetry-v1"
  # Which id fields to hash. user_id kept RAW so dashboards can filter by the
  # real user_id/portfolio_id passed in. Set to "user_id,anon_id,session_id" to hash all.
  TELEMETRY_HASH_IDS: "anon_id,session_id"
  TELEMETRY_RATE_LIMIT_PER_MIN: "120"
  LOG_LEVEL: INFO
  TZ: Asia/Kolkata

probes:
  port: 8000
  startup:
    path: /health
    failureThreshold: 30
    periodSeconds: 10
  liveness:
    path: /health
  readiness:
    path: /health

resources:
  limits:
    cpu: 300m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: "/metrics"

ingress:
  enabled: false
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
  hosts: []
