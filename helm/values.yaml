# am-logging — base Helm values (universal-chart via am-pipelines)
global:
  image:
    registry: ghcr.io/am-portfolio
    pullPolicy: Always
    imagePullSecrets:
      - name: regcred
  vault:
    enabled: true
    role: "am-backend-role"
    authPath: "auth/kubernetes"
    serviceAccountName: "am-backend-sa"

image:
  repository: am-logging

replicaCount: 1
language: python
port: 8000
service:
  port: 8000
entrypoint: "exec uvicorn main:app --host 0.0.0.0 --port 8000"

security:
  automountServiceAccountToken: true

config: {}

vault:
  enabled: true
  secretPaths:
    otel:
      path: "apps/data/preprod/infra/observability"
      mappings:
        TRACING_SAMPLING_PROBABILITY: "TRACING_SAMPLING_PROBABILITY"
    mongodb:
      path: "apps/data/preprod/infra/mongodb"
      template: |
        {{- with secret "apps/data/preprod/infra/mongodb" -}}
        export MONGO_URL="mongodb://{{ .Data.data.username }}:{{ .Data.data.password }}@mongodb.infra.svc.cluster.local:27017/am_analytics?authSource=admin"
        {{- end }}
    redis:
      path: "apps/data/preprod/infra/redis"
      template: |
        {{- with secret "apps/data/preprod/infra/redis" -}}
        export REDIS_URL="redis://:{{ .Data.data.password }}@{{ .Data.data.host }}:{{ .Data.data.port }}/0"
        {{- end }}

env:
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4318/v1/traces"
  LOKI_URL: "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
  LOG_LEVEL: INFO
  TZ: Asia/Kolkata

probes:
  port: 8000
  startup:
    path: /health
    failureThreshold: 30
    periodSeconds: 10
  liveness:
    path: /health
  readiness:
    path: /health

resources:
  limits:
    cpu: 300m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: "/metrics"

ingress:
  enabled: false
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
  hosts: []
