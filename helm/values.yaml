# ==============================================================================
# am-logging Helm Chart — Base Values
#
# DESIGN PRINCIPLE:
#   ALL sensitive runtime config (URLs, credentials) comes from HashiCorp Vault.
# ==============================================================================

environment: local
namespace: am-apps-preprod

# Global configuration emulating the am-auth pattern
global:
  isLocal: false
  image:
    registry: ghcr.io/am-portfolio
    pullPolicy: IfNotPresent
    tag: "latest"

  vault:
    enabled: true
    address: "http://vault.vault.svc.cluster.local:8200"
    role: "am-auth"
    authPath: "auth/kubernetes"
    # KV v2 paths for secrets
    secrets:
      redis:   "secret/data/am-logging/local/redis"
      mongodb: "secret/data/am-logging/local/mongodb"
      loki:    "secret/data/am-logging/local/loki"
      # Sampling — cluster SoT (override per env in values.<env>.yaml if present)
      otel:    "apps/data/preprod/infra/observability"

# Service-specific configuration
replicaCount: 1

image:
  repository: am-logging-svc
  tag: "latest"

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

# Non-sensitive resources
resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "300m"

# Plane A — Prometheus scrape (path /metrics on container port)
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: "/metrics"

# Non-secret OTEL endpoint; sampling from Vault apps/data/{env}/infra/observability
env:
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4318/v1/traces"
