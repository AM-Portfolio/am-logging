# Preprod — public /logging for Flutter product telemetry
environment: preprod
replicaCount: 1

vault:
  enabled: true
  role: "am-backend-role"
  csi:
    enabled: true
  secretPaths:
    otel:
      path: "apps/data/preprod/infra/observability"
      mappings:
        TRACING_SAMPLING_PROBABILITY: "TRACING_SAMPLING_PROBABILITY"
    mongodb:
      path: "apps/data/preprod/infra/mongodb"
      mappings:
        MONGO_USERNAME: "username"
        MONGO_PASSWORD: "password"
    redis:
      path: "apps/data/preprod/infra/redis"
      mappings:
        REDIS_PASSWORD: "password"
        REDIS_HOST: "host"
        REDIS_PORT: "port"

env:
  ENVIRONMENT: preprod
  ALLOWED_ORIGINS: "http://localhost:3000,https://am-preprod.asrax.in"

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-preprod-global-cors@kubernetescrd,
      am-apps-preprod-strip-prefix-apps@kubernetescrd
  hosts:
    - host: am-preprod.asrax.in
      paths:
        - path: /logging
          pathType: Prefix
