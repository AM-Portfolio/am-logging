name: AM Logging Publish

on:
  push:
    branches: ["main", "develop", "test/**", "feature/**", "hotfix/**", "fix/**"]
    paths:
      - "service/**"
      - "helm/**"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/am-logging.yml"
  pull_request:
    branches: ["main", "develop", "test/**", "feature/**", "hotfix/**", "fix/**"]
    paths:
      - "service/**"
      - "helm/**"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/am-logging.yml"
  workflow_dispatch:

jobs:
  publish:
    name: Publish AM Logging
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-build-publish.yml@develop
    with:
      language: "python"
      working_directory: "."
      image_name: "am-logging"
      build_context: "."
      preprod_namespace: "am-apps-preprod"
      prod_namespace: "am-apps-prod"
      deploy_dev: true
      deploy_prod: true
    secrets: inherit
